name: Publish

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Publish target
        required: true
        type: choice
        options:
          - testpypi
          - both
  push:
    tags:
      - "release-v*"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    outputs:
      publish_target: ${{ steps.meta.outputs.publish_target }}
      core_version: ${{ steps.versions.outputs.core_version }}
      livekit_version: ${{ steps.versions.outputs.livekit_version }}
      keda_version: ${{ steps.keda_version.outputs.version }}
    steps:
      - name: Determine publish target
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            target_input="${{ inputs.environment }}"
          else
            target_input="both"
          fi

          if [[ "${target_input}" != "testpypi" && "${target_input}" != "both" ]]; then
            echo "Unsupported publish target: ${target_input}" >&2
            exit 1
          fi

          echo "publish_target=${target_input}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync workspace
        working-directory: livekit-lkscaler
        run: uv sync --all-packages --group dev

      - name: Resolve package versions
        id: versions
        shell: bash
        working-directory: livekit-lkscaler
        run: |
          core_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          pyproject = Path('packages/lkscaler-core/pyproject.toml')
          data = tomllib.loads(pyproject.read_text())
          print(data['project']['version'])
          PY
          )"
          livekit_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          pyproject = Path('packages/lkscaler-livekit/pyproject.toml')
          data = tomllib.loads(pyproject.read_text())
          print(data['project']['version'])
          PY
          )"
          echo "core_version=${core_version}" >> "$GITHUB_OUTPUT"
          echo "livekit_version=${livekit_version}" >> "$GITHUB_OUTPUT"

      - name: Resolve the KEDA package version
        id: keda_version
        shell: bash
        working-directory: livekit-lkscaler
        run: |
          keda_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          pyproject = Path('packages/lkscaler-keda/pyproject.toml')
          data = tomllib.loads(pyproject.read_text())
          print(data['project']['version'])
          PY
          )"
          echo "version=${keda_version}" >> "$GITHUB_OUTPUT"

      - name: Enforce matching release versions
        shell: bash
        working-directory: livekit-lkscaler
        run: |
          core_version="${{ steps.versions.outputs.core_version }}"
          livekit_version="${{ steps.versions.outputs.livekit_version }}"
          keda_version="${{ steps.keda_version.outputs.version }}"
          if [[ "${core_version}" != "${livekit_version}" || "${core_version}" != "${keda_version}" ]]; then
            echo "error: lkscaler-core (${core_version}), livekit-lkscaler (${livekit_version}) and lkscaler-keda (${keda_version}) must share one release version" >&2
            exit 1
          fi

      - name: Validate release tag against package versions
        if: github.event_name == 'push'
        shell: bash
        working-directory: livekit-lkscaler
        run: |
          expected="release-v${{ steps.versions.outputs.core_version }}"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "error: tag ${GITHUB_REF_NAME} does not match package version ${expected}" >&2
            exit 1
          fi

      - name: Build all three packages
        working-directory: livekit-lkscaler
        run: |
          uv build packages/lkscaler-core --out-dir dist/core
          uv build packages/lkscaler-livekit --out-dir dist/livekit
          uv build packages/lkscaler-keda --out-dir dist/keda

      - name: Twine check
        working-directory: livekit-lkscaler
        run: uv run --with twine twine check dist/core/* dist/livekit/* dist/keda/*

      - name: Smoke install built wheels
        working-directory: livekit-lkscaler
        run: |
          python -m venv .venv-publish-smoke
          .venv-publish-smoke/bin/python -m pip install --upgrade pip
          .venv-publish-smoke/bin/pip install dist/core/*.whl dist/livekit/*.whl dist/keda/*.whl
          .venv-publish-smoke/bin/python -c "import lkscaler_core, lkscaler_keda, lkscaler_livekit; print(lkscaler_core.__name__, lkscaler_livekit.__name__, lkscaler_keda.__name__)"

      - name: Assemble dist payload
        working-directory: livekit-lkscaler
        run: |
          mkdir -p dist/all
          cp dist/core/* dist/all/
          cp dist/livekit/* dist/all/
          cp dist/keda/* dist/all/

      - name: Verify all three distributions are in the payload
        shell: bash
        working-directory: livekit-lkscaler
        run: |
          for dist in lkscaler_core livekit_lkscaler lkscaler_keda; do
            wheels=(dist/all/${dist}-*.whl)
            sdists=(dist/all/${dist}-*.tar.gz)
            if [[ ! -f "${wheels[0]}" || ! -f "${sdists[0]}" ]]; then
              echo "error: missing wheel or sdist for ${dist} in dist/all" >&2
              ls -l dist/all >&2
              exit 1
            fi
          done

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-all
          path: livekit-lkscaler/dist/all

  publish-testpypi:
    needs: [build-and-verify]
    if: ${{ needs.build-and-verify.outputs.publish_target == 'testpypi' || needs.build-and-verify.outputs.publish_target == 'both' }}
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-all
          path: dist

      - name: Publish all three packages to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true

  gate-testpypi-install:
    needs: [build-and-verify, publish-testpypi]
    if: ${{ needs.build-and-verify.outputs.publish_target == 'testpypi' || needs.build-and-verify.outputs.publish_target == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate install of all three packages from TestPyPI
        shell: bash
        run: |
          python -m venv .venv-testpypi-gate
          .venv-testpypi-gate/bin/python -m pip install --upgrade pip
          for attempt in 1 2 3 4 5 6 7 8; do
            if .venv-testpypi-gate/bin/pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ lkscaler-core==${{ needs.build-and-verify.outputs.core_version }} livekit-lkscaler==${{ needs.build-and-verify.outputs.livekit_version }} lkscaler-keda==${{ needs.build-and-verify.outputs.keda_version }}; then
              break
            fi
            if [[ "${attempt}" -eq 8 ]]; then
              echo "TestPyPI packages did not become installable after retries." >&2
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
          .venv-testpypi-gate/bin/python -c "import lkscaler_core, lkscaler_keda, lkscaler_livekit; print('testpypi-gate-ok', lkscaler_core.__name__, lkscaler_livekit.__name__, lkscaler_keda.__name__)"

  publish-pypi:
    needs: [build-and-verify, gate-testpypi-install]
    if: ${{ needs.build-and-verify.outputs.publish_target == 'both' && needs.gate-testpypi-install.result == 'success' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-all
          path: dist

      - name: Split payload by package
        shell: bash
        run: |
          mkdir -p dist/core dist/livekit dist/keda
          for file in dist/lkscaler_core-*; do mv "${file}" dist/core/; done
          for file in dist/livekit_lkscaler-*; do mv "${file}" dist/livekit/; done
          for file in dist/lkscaler_keda-*; do mv "${file}" dist/keda/; done

      - name: Publish lkscaler-core to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/core

      - name: Publish livekit-lkscaler to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/livekit

      - name: Publish lkscaler-keda to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/keda
