name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: livekit-lkscaler
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync workspace
        run: uv sync --all-packages --group dev

      - name: Ruff
        run: make lint-check

      - name: Mypy
        run: make typecheck

      - name: Unit tests
        run: make test-unit

      - name: Integration tests
        run: make test-integration

      - name: Coverage gate (unit + integration)
        run: make test-coverage

      - name: E2E tests
        run: make test-e2e

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: livekit-lkscaler/e2e/artifacts
          if-no-files-found: ignore
