[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "livekit-lkscaler"
version = "1.0.0"
description = "LiveKit agent hooks that bin-pack jobs so self-hosted fleets scale down sooner"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "LKScaler Maintainers" },
]
keywords = ["livekit", "agents", "zookeeper", "binpack", "scaling"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "lkscaler-core>=1.0.0",
  "livekit-agents>=1.6.2",
]

[project.urls]
Documentation = "https://github.com/computo-experto/livekit-lkscaler/tree/main/livekit-lkscaler/docs/usage"
Homepage = "https://github.com/computo-experto/livekit-lkscaler"
Repository = "https://github.com/computo-experto/livekit-lkscaler"
Issues = "https://github.com/computo-experto/livekit-lkscaler/issues"

[tool.uv.sources]
lkscaler-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/lkscaler_livekit"]
