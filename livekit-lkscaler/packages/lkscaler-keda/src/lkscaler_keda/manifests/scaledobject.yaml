apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ${SCALEDOBJECT_NAME}
  namespace: ${NAMESPACE}
spec:
  scaleTargetRef:
    name: ${DEPLOYMENT_NAME}
  minReplicaCount: ${MIN_REPLICA_COUNT}
  maxReplicaCount: ${MAX_REPLICA_COUNT}
  pollingInterval: ${POLL_INTERVAL_SEC}
  cooldownPeriod: ${SCALE_DOWN_DWELL_SEC}
  triggers:
    - type: external
      metadata:
        scalerAddress: ${SCALER_ADDRESS}
        metricName: cluster_free_slots
        target: "${MIN_CLUSTER_FREE_SLOTS}"
    - type: external
      metadata:
        scalerAddress: ${SCALER_ADDRESS}
        metricName: safe_remaining_free_slots_after_one_idle_removal
        target: "${MIN_CLUSTER_FREE_SLOTS}"