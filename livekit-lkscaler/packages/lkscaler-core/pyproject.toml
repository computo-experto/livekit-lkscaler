[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "lkscaler-core"
version = "0.2.0"
description = "Bin-pack LiveKit agent jobs onto fewer workers so idle capacity can be scaled down sooner"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "LKScaler Maintainers" },
]
keywords = ["livekit", "zookeeper", "binpack", "autoscaling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "kazoo>=2.11.0",
  "pydantic>=2.8.0",
]

[project.urls]
Documentation = "https://github.com/computo-experto/livekit-lkscaler/tree/main/livekit-lkscaler/docs/usage"
Homepage = "https://github.com/computo-experto/livekit-lkscaler"
Repository = "https://github.com/computo-experto/livekit-lkscaler"
Issues = "https://github.com/computo-experto/livekit-lkscaler/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lkscaler_core"]
