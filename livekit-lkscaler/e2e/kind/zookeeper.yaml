apiVersion: apps/v1
kind: Deployment
metadata:
  name: zk
  namespace: livekit-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zk
  template:
    metadata:
      labels:
        app: zk
    spec:
      containers:
        - name: zk
          image: zookeeper:3.9
          ports:
            - containerPort: 2181
          readinessProbe:
            exec:
              command: ["sh", "-c", "zkServer.sh status"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: zk
  namespace: livekit-system
spec:
  selector:
    app: zk
  ports:
    - name: client
      port: 2181
      targetPort: 2181
