apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-svc
  namespace: ${NAMESPACE}
spec:
  selector:
    app: livekit-server
  ports:
    - name: http
      port: 7880
      targetPort: 7880
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-server
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit-server
  template:
    metadata:
      labels:
        app: livekit-server
    spec:
      enableServiceLinks: false
      containers:
        - name: livekit-server
          image: livekit/livekit-server:latest
          args: ["--dev", "--bind", "0.0.0.0"]
          ports:
            - containerPort: 7880
            - containerPort: 7881
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-agents
  namespace: ${NAMESPACE}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: livekit-agents
  template:
    metadata:
      labels:
        app: livekit-agents
    spec:
      enableServiceLinks: false
      containers:
        - name: livekit-agent
          image: ${AGENT_IMAGE}
          command: ["uv", "run", "python", "/app/e2e/fixtures/test_agent.py"]
          env:
            - name: LIVEKIT_URL
              value: ws://livekit-svc.${NAMESPACE}.svc.cluster.local:7880
            - name: LIVEKIT_API_KEY
              value: devkey
            - name: LIVEKIT_API_SECRET
              value: secret
            - name: LKSCALER_NAMESPACE
              value: livekit-lkscaler
            - name: LKSCALER_POD_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LKSCALER_ROOM_TARGET_N
              value: "3"
            - name: LKSCALER_OVERFLOW_MARGIN
              value: "1"
            - name: LKSCALER_RESERVATION_TTL_SEC
              value: "30"
            - name: LKSCALER_ZK_SESSION_TIMEOUT_SEC
              value: "10"
            - name: LKSCALER_SYNC_INTERVAL_MS
              value: "250"