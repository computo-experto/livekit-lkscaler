services:
  zk1:
    image: zookeeper:3.9
    hostname: zk1
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zk1:2888:3888;2181 server.2=zk2:2888:3888;2181 server.3=zk3:2888:3888;2181
      ZOO_4LW_COMMANDS_WHITELIST: ruok
    ports:
      - "12181:2181"
    healthcheck:
      test: ["CMD", "sh", "-c", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 5s
      timeout: 5s
      retries: 20
  zk2:
    image: zookeeper:3.9
    hostname: zk2
    environment:
      ZOO_MY_ID: 2
      ZOO_SERVERS: server.1=zk1:2888:3888;2181 server.2=zk2:2888:3888;2181 server.3=zk3:2888:3888;2181
      ZOO_4LW_COMMANDS_WHITELIST: ruok
    healthcheck:
      test: ["CMD", "sh", "-c", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 5s
      timeout: 5s
      retries: 20
  zk3:
    image: zookeeper:3.9
    hostname: zk3
    environment:
      ZOO_MY_ID: 3
      ZOO_SERVERS: server.1=zk1:2888:3888;2181 server.2=zk2:2888:3888;2181 server.3=zk3:2888:3888;2181
      ZOO_4LW_COMMANDS_WHITELIST: ruok
    healthcheck:
      test: ["CMD", "sh", "-c", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 5s
      timeout: 5s
      retries: 20
  livekit:
    image: livekit/livekit-server:latest
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      - "7880:7880"
      - "7881:7881/udp"
    depends_on:
      zk1:
        condition: service_healthy
      zk2:
        condition: service_healthy
      zk3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:7880/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
  agent1:
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      LKSCALER_NAMESPACE: livekit-lkscaler
      LKSCALER_POD_ID: agent1
      LKSCALER_ROOM_TARGET_N: "3"
      LKSCALER_OVERFLOW_MARGIN: "1"
      LKSCALER_RESERVATION_TTL_SEC: "30"
      LKSCALER_ZK_SESSION_TIMEOUT_SEC: "10"
      LKSCALER_SYNC_INTERVAL_MS: "250"
    depends_on:
      livekit:
        condition: service_healthy
      zk1:
        condition: service_healthy
  agent2:
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      LKSCALER_NAMESPACE: livekit-lkscaler
      LKSCALER_POD_ID: agent2
      LKSCALER_ROOM_TARGET_N: "3"
      LKSCALER_OVERFLOW_MARGIN: "1"
      LKSCALER_RESERVATION_TTL_SEC: "30"
      LKSCALER_ZK_SESSION_TIMEOUT_SEC: "10"
      LKSCALER_SYNC_INTERVAL_MS: "250"
    depends_on:
      livekit:
        condition: service_healthy
      zk1:
        condition: service_healthy
  redis:
    profiles: [backends]
    image: redis:7
    hostname: redis
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  packed-agent1:
    profiles: [backends]
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    command: ["/app/.venv/bin/python", "-u", "e2e/fixtures/packed_agent.py"]
    environment:
      LKSCALER_BACKEND: ${LKSCALER_E2E_BACKEND:-zookeeper}
      LKSCALER_NAMESPACE: ${LKSCALER_E2E_NAMESPACE:-livekit-lkscaler-e2e}
      LKSCALER_POD_ID: packed-agent1
      LKSCALER_ZK_HOSTS: zk1:2181,zk2:2181,zk3:2181
      LKSCALER_REDIS_URL: redis://redis:6379/0
      LKSCALER_ROOM_TARGET_N: "2"
      LKSCALER_OVERFLOW_MARGIN: "1"
      LKSCALER_RESERVATION_TTL_SEC: "5"
      LKSCALER_POD_STATE_TTL_SEC: "5"
      LKSCALER_ZK_SESSION_TIMEOUT_SEC: "5"
      LKSCALER_SYNC_INTERVAL_MS: "250"
    ports:
      - "18090:8090"
    depends_on:
      zk1:
        condition: service_healthy
      redis:
        condition: service_healthy
  packed-agent2:
    profiles: [backends]
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    command: ["/app/.venv/bin/python", "-u", "e2e/fixtures/packed_agent.py"]
    environment:
      LKSCALER_BACKEND: ${LKSCALER_E2E_BACKEND:-zookeeper}
      LKSCALER_NAMESPACE: ${LKSCALER_E2E_NAMESPACE:-livekit-lkscaler-e2e}
      LKSCALER_POD_ID: packed-agent2
      LKSCALER_ZK_HOSTS: zk1:2181,zk2:2181,zk3:2181
      LKSCALER_REDIS_URL: redis://redis:6379/0
      LKSCALER_ROOM_TARGET_N: "2"
      LKSCALER_OVERFLOW_MARGIN: "1"
      LKSCALER_RESERVATION_TTL_SEC: "5"
      LKSCALER_POD_STATE_TTL_SEC: "5"
      LKSCALER_ZK_SESSION_TIMEOUT_SEC: "5"
      LKSCALER_SYNC_INTERVAL_MS: "250"
    ports:
      - "18091:8090"
    depends_on:
      zk1:
        condition: service_healthy
      redis:
        condition: service_healthy
  livekit-prod:
    profiles: [real-agents]
    image: livekit/livekit-server:latest
    command: ["--bind", "0.0.0.0"]
    environment:
      LIVEKIT_KEYS: "devkey: devsecretdevsecretdevsecretdevsecret"
      LIVEKIT_RTC_USE_EXTERNAL_IP: "false"
    ports:
      - "17880:7880"
      - "17881:7881/udp"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:7880/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
  real-agent1:
    profiles: [real-agents]
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    command: ["/app/.venv/bin/python", "-u", "e2e/fixtures/real_agent.py", "start"]
    image: lkscaler-e2e-real-agent:local
    environment:
      <<: &real-agent-env
        LIVEKIT_URL: ws://livekit-prod:7880
        LIVEKIT_API_KEY: devkey
        LIVEKIT_API_SECRET: devsecretdevsecretdevsecretdevsecret
        LKSCALER_BACKEND: ${LKSCALER_E2E_BACKEND:-zookeeper}
        LKSCALER_NAMESPACE: ${LKSCALER_E2E_NAMESPACE:-livekit-lkscaler-e2e}
        LKSCALER_ZK_HOSTS: zk1:2181,zk2:2181,zk3:2181
        LKSCALER_REDIS_URL: redis://redis:6379/0
        LKSCALER_ROOM_TARGET_N: "2"
        LKSCALER_OVERFLOW_MARGIN: "1"
        LKSCALER_RESERVATION_TTL_SEC: "5"
        LKSCALER_POD_STATE_TTL_SEC: "5"
        LKSCALER_ZK_SESSION_TIMEOUT_SEC: "5"
        LKSCALER_SYNC_INTERVAL_MS: "250"
        LKSCALER_LOAD_THRESHOLD: "0.7"
        LKSCALER_AGENT_NAME: m9real
        LKSCALER_HTTP_PORT: "8090"
      LKSCALER_POD_ID: real-agent1
    ports:
      - "18092:8090"
    depends_on:
      livekit-prod:
        condition: service_healthy
      zk1:
        condition: service_healthy
      redis:
        condition: service_healthy
  real-agent2:
    profiles: [real-agents]
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    command: ["/app/.venv/bin/python", "-u", "e2e/fixtures/real_agent.py", "start"]
    image: lkscaler-e2e-real-agent:local
    environment:
      <<: *real-agent-env
      LKSCALER_POD_ID: real-agent2
    ports:
      - "18093:8090"
    depends_on:
      livekit-prod:
        condition: service_healthy
      zk1:
        condition: service_healthy
      redis:
        condition: service_healthy
  real-agent3:
    profiles: [real-agents]
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    command: ["/app/.venv/bin/python", "-u", "e2e/fixtures/real_agent.py", "start"]
    image: lkscaler-e2e-real-agent:local
    environment:
      <<: *real-agent-env
      LKSCALER_POD_ID: real-agent3
    ports:
      - "18094:8090"
    depends_on:
      livekit-prod:
        condition: service_healthy
      zk1:
        condition: service_healthy
      redis:
        condition: service_healthy
