services:
  zk1:
    image: zookeeper:3.9
    hostname: zk1
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zk1:2888:3888;2181 server.2=zk2:2888:3888;2181 server.3=zk3:2888:3888;2181
      ZOO_4LW_COMMANDS_WHITELIST: ruok
    ports:
      - "12181:2181"
    healthcheck:
      test: ["CMD", "sh", "-c", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 5s
      timeout: 5s
      retries: 20
  zk2:
    image: zookeeper:3.9
    hostname: zk2
    environment:
      ZOO_MY_ID: 2
      ZOO_SERVERS: server.1=zk1:2888:3888;2181 server.2=zk2:2888:3888;2181 server.3=zk3:2888:3888;2181
      ZOO_4LW_COMMANDS_WHITELIST: ruok
    healthcheck:
      test: ["CMD", "sh", "-c", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 5s
      timeout: 5s
      retries: 20
  zk3:
    image: zookeeper:3.9
    hostname: zk3
    environment:
      ZOO_MY_ID: 3
      ZOO_SERVERS: server.1=zk1:2888:3888;2181 server.2=zk2:2888:3888;2181 server.3=zk3:2888:3888;2181
      ZOO_4LW_COMMANDS_WHITELIST: ruok
    healthcheck:
      test: ["CMD", "sh", "-c", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 5s
      timeout: 5s
      retries: 20
  livekit:
    image: livekit/livekit-server:latest
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      - "7880:7880"
      - "7881:7881/udp"
    depends_on:
      zk1:
        condition: service_healthy
      zk2:
        condition: service_healthy
      zk3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:7880/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
  agent1:
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      LKSCALER_NAMESPACE: livekit-lkscaler
      LKSCALER_POD_ID: agent1
      LKSCALER_ROOM_TARGET_N: "3"
      LKSCALER_OVERFLOW_MARGIN: "1"
      LKSCALER_RESERVATION_TTL_SEC: "30"
      LKSCALER_ZK_SESSION_TIMEOUT_SEC: "10"
      LKSCALER_SYNC_INTERVAL_MS: "250"
    depends_on:
      livekit:
        condition: service_healthy
      zk1:
        condition: service_healthy
  agent2:
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      LKSCALER_NAMESPACE: livekit-lkscaler
      LKSCALER_POD_ID: agent2
      LKSCALER_ROOM_TARGET_N: "3"
      LKSCALER_OVERFLOW_MARGIN: "1"
      LKSCALER_RESERVATION_TTL_SEC: "30"
      LKSCALER_ZK_SESSION_TIMEOUT_SEC: "10"
      LKSCALER_SYNC_INTERVAL_MS: "250"
    depends_on:
      livekit:
        condition: service_healthy
      zk1:
        condition: service_healthy
